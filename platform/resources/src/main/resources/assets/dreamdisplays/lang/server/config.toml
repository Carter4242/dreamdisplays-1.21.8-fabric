# Dream Displays configuration
# Support: https://discord.gg/uwMMZ2KWk6

[language]
# Default language if no translation is available
default_language = "en"

[proxy]
# BungeeCord / Velocity network coordination
enabled = false

# Seconds between clock-offset probes to the proxy
clock_sync_interval = 5

[display]
# Selection tool and base block
# Slabs and stairs of base block are selectable too
selection_material = "minecraft:diamond_axe"
base_material = "minecraft:black_concrete"

# Display size limits
# All values are in blocks
max_render_distance = 96.0
min_width = 1
min_height = 1
max_width = 32
max_height = 24

# Particle effects for selection visualization
# Not available on Folia
particles = true
particles_color = "#00FFFF"

# Mod detection notifications
# Players without Dream Displays will be asked to install it
mod_detection_enabled = true

# Update notifications
updates = true

# Default volume for newly seen displays, in the same units as the client slider (0 to 200, default 50)
default_volume = 50

# Max displays one player may own at once. 0 or less means no limit
max_displays_per_player = 0

# Synced displays: after a resume / a seek or restart, the timeline stays paused until every nearby viewer holds the
# video ready at the new position (instant when it already was, e.g. resuming a paused display), for at most this
# many seconds, then everyone starts together (0 to 60, 0 = start at once without waiting)
resume_hold_seconds = 1
seek_hold_seconds = 3

# Starts are scheduled this far ahead at most (covering the slowest viewer's latency) so everyone begins on the
# same frame; 0 starts on receipt (0 to 1000 ms)
start_lead_max_ms = 150

# Playback mode new displays start in: "synced" (everyone sees the same moment) or "local"
default_mode = "synced"

# Pause a playing synced display once nobody has been in its range for this many seconds.
# It is not resumed automatically; the next viewer presses play. 0 = never
auto_pause_when_empty_seconds = 0

# Display policy: server-controlled client behaviour, sent with every display.
# Anything left unset uses the client's own default. A display can override any of these for itself
# with /display policy <display> <section.key> <value>; /display config <key> <value> edits this file in-game.
[policy.sync]
# Playback sync for Synced / Broadcast displays and watch parties
# enabled = true            # false = no gentle rate correction (large drift is still fixed by seeking)
# dead_band_ms = 40         # drift below this is left alone
# max_rate_pct = 1.0        # largest speed change used to close drift (1.0 = 0.99x to 1.01x)
# seek_threshold_ms = 1500  # drift above this is fixed by seeking instead
# seek_cooldown_ms = 8000   # minimum time between corrective seeks
# corrective_seeks = true   # false = clients never seek on their own while playing; drift is closed by speed only
# cheap_seeks = true        # false = no faster seeking for streams that seek within a frame (threshold/cooldown above apply)

[policy.audio]
# How far display sound carries (per display: /display policy <id> audio.<key> <value>)
# radius_blocks = 96        # sound fades to silence at this distance
# full_volume_blocks = 0    # full volume within this distance, fading starts beyond it
# falloff = "squared"       # "squared" (drops fast near the edge) or "linear"
# start_volume = 0.5        # volume players start at the first time they see a display (0 to 1)
# max_volume = 2.0          # highest volume players can set (0 to 2, 1 = 100 %)

[policy.visibility]
# max_distance_blocks = 96  # displays further away are not loaded or played (players' render distance still applies)

[policy.quality]
# max_height = 1080         # highest resolution clients stream (e.g. 720, 1080)

[policy.client]
# Overrides for players' own client settings; unset = each player's choice (their saved settings are not changed).
# Applied within a second or two of /display config or /display reload.
# enabled = true            # false = displays are not loaded or played at all (emergency switch; per display too)
# max_active_displays = 0   # how many displays may play at once, nearest first; 0 = no limit (server-wide only)
# hardware_decoding = true  # false = software video decoding, for videos loaded afterwards (server-wide only)
# audio_acoustics = "advanced"  # 3D audio: "off", "basic", "advanced" or "ultra" (per display too)
# unshaded_displays = true  # false = shader packs may grade the video (server-wide only)
# display_distance_chunks = 0  # how far displays stay loaded; 0 = render / simulation distance (per display too)
# audio_output_profile = "headphones"  # 3D audio rendering: "headphones" (binaural) or "speakers" (server-wide only)
# audio_normalization = true  # false = no loudness levelling between videos (server-wide only)
# Rescue switches for one bad client path (server-wide only). Turning one on reloads the displays players have loaded.
# video_decoder = "auto"    # "process" = no in-process decoding; "jvm" = no native library (FFmpeg into Java, slowest)
# gpu_yuv = true            # false = frames converted to RGBA before upload instead of drawn from YUV planes
# texture_upload = "auto"   # "basic" = plain uploads, no persistently mapped buffers
# audio_backend = "auto"    # "javasound" or "openal" forces display audio onto one backend
# disabled_resolvers = []   # e.g. ["newpipe"]: never use these to open links (direct, newpipe, yt-dlp, twitch, kick,
#                           # vimeo, bilibili); a link nothing else opens still tries all of them
# ffmpeg_source = "auto"    # "system" = an installed FFmpeg first; "bundled" = the downloaded one first
# yt_dlp_source = "auto"    # "system" = an installed yt-dlp first; "bundled" = the downloaded one first
# queue_preload = true      # false = the next queue entry is not loaded ahead of time
# auto_warm = true          # false = paused displays are not kept ready to play on their own (starts don't wait for them)

[policy.debug]
# Client diagnostics (server-wide only); clients read these without needing an update.
# log_level = "quiet"       # what clients write to their own log: quiet (failures only), normal, verbose, ultra.
#                           # One player: /display debug <player> <level> (overrides this; kept across restarts)
# sync_log_interval_seconds = 0  # seconds between "[dd-sync]" drift lines; unset = by log_level (verbose 10, ultra 1)
# verbose = false           # old switch; true = log_level "verbose"
# report_interval_seconds = 5  # seconds between the viewer reports behind /display stats <display>; 0 = off

[policy.network]
# read_ahead_seconds = 30   # seconds of a direct video file (.mp4 / .webm link) clients keep downloaded ahead; 0 = off
# live_latency_ms = 80      # SRT receive latency for live relay links (srt://...) that set none; 20-5000.
#                           # Lower = closer to real time, higher = rides out more packet loss

[custom_media]
# Custom videos: links players paste themselves (direct .mp4 / .m3u8 files, file hosts,
# and any other site the resolver can open)
# Note that this section never affects supported platforms (YouTube, Twitch, Kick, etc.)
enabled = true

# Optional allowlist of hosts. Empty = every host is allowed
# Subdomains are included, so "example.com" also covers "cdn.example.com"
# allowed_hosts = ["cdn.example.com", "files.myserver.net"]
allowed_hosts = []

# Hosts that are always refused, checked before allowed_hosts
# blocked_hosts = ["bad.example"]
blocked_hosts = []

[live]
# Built-in "Share screen": a player with the share permission streams a monitor from the display menu to a relay
# (MediaMTX, https://github.com/bluenviron/mediamtx) and everyone sees it on the display with well under a second of
# delay. The mod encodes with its own FFmpeg; nobody needs OBS. Video only for now.
# Both are templates: {id} becomes a fresh random stream id for every share, so nobody can guess where to publish.
# Leave either empty to turn sharing off. The play URL must point at a public host (clients refuse private addresses).
# Use RTMP with MediaMTX (open TCP 1935): ~35 ms through the relay. MediaMTX pins SRT at 120 ms per leg (~400 ms
# end to end), and the macOS FFmpeg builds the mod downloads have no SRT at all. rtmps:// (RTMP over TLS, e.g. on
# 443) works the same way; switching scheme, host or port here needs no client update.
# Protect publishing with MediaMTX credentials in the query (FFmpeg does not send rtmp://user:pass@ to MediaMTX).
# Only the sharing player's client is ever sent the publish URL; viewers get the play URL. The server log, chat and
# /display config show the publish credentials redacted. Set it here or from the console: a command a player types
# is also recorded by other plugins (e.g. command loggers) before Dream Displays sees it.
# relay_publish_url = "rtmps://relay.example.com:443/{id}?user=publish&pass=CHANGE-ME"
# relay_play_url = "rtmps://relay.example.com:443/{id}"
relay_publish_url = ""
relay_play_url = ""
# Optional relay lease service (a small HTTP service next to MediaMTX that MediaMTX asks before every publish and
# read). With it, every share gets its own publish key: put {key} in relay_publish_url, e.g.
# "rtmps://relay.example.com:443/{id}?user=dd&pass={key}". The server tells the service which shares run (on every
# change and every few seconds), the relay only lets a running share publish or be watched, and it cuts a share's
# stream within a second of the share ending here, even if the sharer's game crashed and its capture runs on. If
# the service can't be reached, new shares are refused and running ones are cut after 20 s.
# relay_control_url = "https://relay.example.com/dd-relay/v1/shares"
# relay_control_token = "CHANGE-ME"
relay_control_url = ""
relay_control_token = ""
# How sharers' clients encode. "auto": each client tests its own GPU encoders per screen and falls back to x264 by
# itself. "software": x264 only, for everyone (if shares fail on many PCs). Sent with every share start, so changing
# it needs no client update.
share_encoder = "auto"
# Caps for every share (0 = the client's default: 30 fps, or 60 where the sharer's PC measures safe; 1080p). Lower
# them to lighten sharers' PCs and the relay.
share_max_fps = 0
share_max_height = 0
# Video bitrate for every share in kbps (0 = the client's default: 6000 at 30 fps, 8000 at 60). Clients keep it within
# 1000..20000. More bits: sharper text while scrolling, but each frame takes longer to upload on the sharer's line.
share_bitrate_kbps = 0
# false: shares never carry sound, whatever the sharer picks (sent with every share start).
share_sound = true

[queue]
# "Up next": players queue videos from the display menu and a synced / broadcast display moves on to the next
# one, for everyone, when the current video ends. Whoever may change a display's video may queue and skip;
# the owner / admins may also reorder, clear and loop. Players without the new client version just see the
# video change when the queue advances.
enabled = true

# Most videos one display may have waiting, and per player (the display's owner is exempt). 0 = no limit
max_items = 50
max_per_player = 10

[karaoke]
# Karaoke on a synced display (needs Simple Voice Chat on the server; /display karaoke). A display is in karaoke while
# someone sings on it (/display karaoke ... singer add, or their turn in the line); when the last singer stops it is
# back to normal. Singers get the display's timeline this far ahead, so they hear the track and see the lyrics early;
# their voice is held back per listener so it lands on the beat for everyone in the display's audio range (policy
# audio.radius_blocks). While someone sings, their voice reaches only players in that range.
#
# Timing is automatic: clients with this mod report their measured audio output, mic capture and voice chat buffer
# latencies, the singer's capture -> server time is measured with synced clocks, and the singer's own client listens
# to their singing against the track and slowly corrects their trim (the mic is analysed only on their client and
# never sent; only the offset is). /display karaoke ... status shows all of it.
#
# Every key below applies live: /display config karaoke.<key> <value> (or edit this file and /display reload).

# Lead for a new singer in ms; 0 = automatic: the singer's measured output + capture + network time, plus the slowest
# listener's network + voice buffer, plus room for a negative trim and lead_margin_ms, kept within min..max_lead_ms
default_lead_ms = 0
lead_margin_ms = 40
min_lead_ms = 260
max_lead_ms = 1500

# Fallbacks for clients that report nothing (older mod versions, no voice chat mod): the singer's audio output + mic
# capture, and a listener's voice chat jitter buffer + audio output (Simple Voice Chat buffers 5 frames = 100 ms by
# default). /display karaoke ... trim still shifts everything by ear on top.
singer_output_capture_ms = 250
listener_buffer_output_ms = 120

# A queued karaoke song whose singer is offline or away from the display when it comes up: "skip" it, or "play"
# it without a singer
absent_singer = "skip"

# Where listeners hear a singer from: "singer" (their position, following them; players within voice chat's proximity
# distance of the singer hear them too, as well as everyone in the display's range) or "display" (its centre, like a PA)
voice_source = "singer"

# How loud singers hear each other (duets) while a song plays, 0.0-1.0; 0 = not at all. Their voices are re-encoded at
# co_singer_volume while the hearing singer is singing (sending voice), and at co_singer_idle_volume once they have
# been quiet for co_singer_idle_after_ms. The change fades: down over co_singer_fade_down_ms (at once when they start
# singing), up over co_singer_fade_up_ms. Between songs and while paused they hear each other normally.
co_singer_volume = 0.15
co_singer_idle_volume = 0.075
co_singer_idle_after_ms = 3000
co_singer_fade_down_ms = 200
co_singer_fade_up_ms = 500

# Volume of the singers' voices for listeners, 0.0-3.0 (1.0 = as voice chat plays them). Above 1.0 loud peaks are
# softly limited instead of clipping. Singers hear each other at co_singer_volume instead.
singer_volume = 1.4

# Volume of the display's own audio (the track) while someone sings, 0.0-1.0, for everyone except the singers, who
# hear it at singer_track_volume instead. 1.0 = unchanged. Players' own volume settings are untouched; it eases back
# after the last singer.
track_volume = 1.0

# Volume of the track for the singers themselves while they sing, 0.0-2.0 (1.0 = unchanged; needs the client mod
# version that knows it, older clients play it at 1.0). Loud peaks above full scale are softly limited.
singer_track_volume = 1.25

# Log every karaoke voice stream as it starts (recipient, distance, packet type)
debug = false

[fullscreen]
# Default visual sub-mode when /display fullscreen start omits one: "STANDARD" or "IMMERSIVE"
default_mode = "STANDARD"

# Whether forced (un-closeable, only minimizable) broadcasts are allowed
allow_forced = true

# Quality cap in pixels of height; clamped down further to the source's own max
quality_cap = 1080

# How long /display fullscreen prepare keeps clients holding a broadcast ready before letting go (10..86400)
prepare_timeout_seconds = 600

[clients]
# Build id (commit, as in the "joined with Dream Displays" log line) of the current client jar.
# /display clients and /display stats mark players on any other commit (-dev / -dirty suffixes ignored);
# unset = expect this plugin's own build (logged at startup as "Enabling DreamDisplays ... (build ...)").
# latest_build = "1a2b3c4d"

# Ask clients to report display errors and playback hitches (op-only: /display errors, /display diag).
# Reports, plus who paused / resumed / seeked / changed video or mode, go to error_log in this folder
# as JSON lines (rotated at 5 MB, one old file kept)
error_reports = true
error_log = "client-errors.log"
command_log = true

[reports]
# Report settings
# webhook_url is a discord webhook URL for sending reports
# cooldown is in seconds
webhook_url = ""
cooldown = 30

[storage]
# Storage type: SQLITE or MYSQL
# If you choose MYSQL, fill in the details below
type = "SQLITE"
host = "localhost"
port = "3306"
database = "database"
username = "username"
password = "password"
table_prefix = ""
use_ssl = false

# Permission nodes are fixed (dreamdisplays.*; see /display help and the plugin README), all operator-only by
# default; grant them with LuckPerms. dreamdisplays.admin grants every one. A [permissions] table here is ignored.
