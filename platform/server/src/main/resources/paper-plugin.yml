name: DreamDisplays
version: '${version}'
main: com.dreamdisplays.platform.server.PaperServer
bootstrapper: com.dreamdisplays.platform.server.PaperBootstrap
api-version: '${paperMinecraftApi}'
description: 'Plugin for the Dream Displays mod.'
website: 'https://github.com/arnodoelinger/dreamdisplays'
authors:
  - arnodoelinger
  - INotSleep
  - Kolyakot33
  - Toffikk
folia-supported: true
# Don't change this format!
# Pre-1.19.4 dependency format on purpose: Paper 1.19.3 only reads this one, and every newer Paper migrates it
# (a declared dependency joins the classpath; load-after loads it before this plugin).
dependencies:
  - name: LuckPerms
    required: false
    bootstrap: false
  - name: WorldGuard
    required: false
    bootstrap: false
  - name: voicechat
    required: false
    bootstrap: false
load-after:
  - name: LuckPerms
    bootstrap: false
  - name: WorldGuard
    bootstrap: false
  - name: voicechat
    bootstrap: false
permissions:
  # Every node is operator-only by default; dreamdisplays.admin grants all of them.
  dreamdisplays.admin:
    default: op
    children:
      dreamdisplays.display.create: true
      dreamdisplays.display.create.unlimited: true
      dreamdisplays.display.delete: true
      dreamdisplays.display.name: true
      dreamdisplays.display.info: true
      dreamdisplays.display.list: true
      dreamdisplays.display.others: true
      dreamdisplays.playback.video: true
      dreamdisplays.playback.speed: true
      dreamdisplays.playback.mode: true
      dreamdisplays.playback.schedule: true
      dreamdisplays.queue: true
      dreamdisplays.karaoke.manage: true
      dreamdisplays.karaoke.join: true
      dreamdisplays.prepare: true
      dreamdisplays.fullscreen: true
      dreamdisplays.fullscreen.network: true
      dreamdisplays.share.manage: true
      dreamdisplays.viewing.toggle: true
      dreamdisplays.viewing.toggle.others: true
      dreamdisplays.admin.config: true
      dreamdisplays.admin.policy: true
      dreamdisplays.diag: true
      dreamdisplays.local: true
      dreamdisplays.synced: true
      dreamdisplays.broadcast: true
      dreamdisplays.watchparty: true
      dreamdisplays.custom: true
      dreamdisplays.lock: true
      dreamdisplays.share: true
      dreamdisplays.premium: true
      dreamdisplays.updates: true
  dreamdisplays.display.create:
    default: op
  dreamdisplays.display.create.unlimited:
    default: op
  dreamdisplays.display.delete:
    default: op
  dreamdisplays.display.name:
    default: op
  dreamdisplays.display.info:
    default: op
  dreamdisplays.display.list:
    default: op
  dreamdisplays.display.others:
    default: op
  dreamdisplays.playback.video:
    default: op
  dreamdisplays.playback.speed:
    default: op
  dreamdisplays.playback.mode:
    default: op
  dreamdisplays.playback.schedule:
    default: op
  dreamdisplays.queue:
    default: op
  dreamdisplays.karaoke.manage:
    default: op
  dreamdisplays.karaoke.join:
    default: op
  dreamdisplays.prepare:
    default: op
  dreamdisplays.fullscreen:
    default: op
  dreamdisplays.fullscreen.network:
    default: op
  dreamdisplays.share.manage:
    default: op
  dreamdisplays.viewing.toggle:
    default: op
  dreamdisplays.viewing.toggle.others:
    default: op
  dreamdisplays.admin.config:
    default: op
  dreamdisplays.admin.policy:
    default: op
  dreamdisplays.diag:
    default: op
  dreamdisplays.local:
    default: op
  dreamdisplays.synced:
    default: op
  dreamdisplays.broadcast:
    default: op
  dreamdisplays.watchparty:
    default: op
  dreamdisplays.custom:
    default: op
  dreamdisplays.lock:
    default: op
  dreamdisplays.share:
    default: op
  dreamdisplays.premium:
    default: op
  dreamdisplays.updates:
    default: op
  # Nodes of the previous release, kept for one release so existing grants still work.
  dreamdisplays.create:
    default: op
    children:
      dreamdisplays.display.create: true
  dreamdisplays.create.bypass:
    default: op
    children:
      dreamdisplays.display.create.unlimited: true
  dreamdisplays.delete:
    default: op
    children:
      dreamdisplays.display.delete: true
  dreamdisplays.delete.others:
    default: op
    children:
      dreamdisplays.display.others: true
  dreamdisplays.name:
    default: op
    children:
      dreamdisplays.display.name: true
  dreamdisplays.name.others:
    default: op
    children:
      dreamdisplays.display.others: true
  dreamdisplays.info:
    default: op
    children:
      dreamdisplays.display.info: true
  dreamdisplays.list:
    default: op
    children:
      dreamdisplays.display.list: true
  dreamdisplays.video:
    default: op
    children:
      dreamdisplays.playback.video: true
  dreamdisplays.speed:
    default: op
    children:
      dreamdisplays.playback.speed: true
  dreamdisplays.mode:
    default: op
    children:
      dreamdisplays.playback.mode: true
  dreamdisplays.schedule:
    default: op
    children:
      dreamdisplays.playback.schedule: true
  dreamdisplays.schedule.others:
    default: op
    children:
      dreamdisplays.display.others: true
  dreamdisplays.karaoke:
    default: op
    children:
      dreamdisplays.karaoke.manage: true
  dreamdisplays.fullscreen.start:
    default: op
    children:
      dreamdisplays.fullscreen: true
      dreamdisplays.prepare: true
  dreamdisplays.fullscreen.stop:
    default: op
    children:
      dreamdisplays.fullscreen: true
  dreamdisplays.fullscreen.list:
    default: op
    children:
      dreamdisplays.fullscreen: true
  dreamdisplays.share.admin:
    default: op
    children:
      dreamdisplays.share.manage: true
  dreamdisplays.help:
    default: op
    children:
      dreamdisplays.viewing.toggle: true
  dreamdisplays.toggle.others:
    default: op
    children:
      dreamdisplays.viewing.toggle.others: true
  dreamdisplays.reload:
    default: op
    children:
      dreamdisplays.admin.config: true
      dreamdisplays.admin.policy: true
      dreamdisplays.diag: true
  dreamdisplays.stats:
    default: op
    children:
      dreamdisplays.diag: true
